- name: install packages
  hosts: Local
  become: yes
  tasks:
   - name: install packages
     ansible.builtin.package:
      name: "{{ item }}" 
      state: "{{ item.state }}"
    loop:
    - { name: 'git', state: 'present'}
    - { name: 'mysql',state: 'absent'}
    - { name: 'gcc', state: 'present'}
    - { name: 'zip', state: 'absent'}